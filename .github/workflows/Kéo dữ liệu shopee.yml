name: Kéo chi phí ads Shopee

on:
  schedule:
    # Cron của GitHub chạy theo UTC, VN = UTC+7 → giờ LẺ của UTC = giờ CHẴN của VN.
    # Chạy 2 tiếng/lần: 00h, 02h, 04h ... 22h giờ VN.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Script xoá-rồi-nạp-lại một khoảng ngày. Hai run chồng nhau sẽ đâm nhau,
# nên xếp hàng chứ không chạy song song.
concurrency:
  group: keo-ads-shopee
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # 1️⃣ Clone repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      #    db-dtypes: BẮT BUỘC — to_dataframe() của BigQuery thiếu nó là raise
      #    pyarrow  : cho load_table_from_dataframe()
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests google-cloud-bigquery google-auth pyarrow db-dtypes

      # 4️⃣ Kéo chi phí ads Shopee từ nhanh.vn → BigQuery
      - name: Run Cost Ads Shopee ETL
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NHANH_COOKIE: ${{ secrets.NHANH_COOKIE }}
          # Không có dòng này thì stdout bị đệm, log in ra lộn xộn:
          # dòng lỗi (stderr) nhảy lên trước cả banner.
          PYTHONUNBUFFERED: "1"
        run: python keo_ads_shopee.py --days 3
