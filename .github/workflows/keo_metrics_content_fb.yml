name: Metrics_Content_FB

on:
  schedule:
    - cron: "*/5 * * * *" # Chạy mỗi 5 phút
  workflow_dispatch:
    inputs:
      start:
        description: "Ngày bắt đầu YYYY-MM-DD (để trống = 7 ngày gần nhất)"
        required: false
      end:
        description: "Ngày kết thúc YYYY-MM-DD (để trống = hôm nay)"
        required: false

concurrency:
  group: meta-ads-video-to-bq
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-cloud-bigquery requests

      - name: Meta Ads -> fact_facebook_ads_video
        run: |
          ARGS=(--write)
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          python -u meta_ads_video_to_bq.py "${ARGS[@]}"
