name: Kéo chi phí TikTok Ads theo chiến dịch

on:
  schedule:
    # GitHub cron chạy theo UTC. 00/05/10/15h UTC = 07/12/17/22h giờ VN.
    # Lệch phút :23 vì đầu giờ tròn GitHub xếp hàng nặng.
    - cron: "23 0,5,10,15 * * *"
  workflow_dispatch:
    inputs:
      last_days:
        description: "Kéo N ngày gần nhất (tính cả hôm nay)"
        required: false
        default: "3"
      date_from:
        description: "Backfill từ ngày YYYY-MM-DD (bỏ trống thì dùng last_days)"
        required: false
      date_to:
        description: "Backfill đến ngày YYYY-MM-DD (bỏ trống = hôm nay)"
        required: false

# 2 run chồng nhau cùng DELETE+INSERT một khoảng ngày -> xếp hàng cho sạch.
concurrency:
  group: tiktok-ads-cost-campaign
  cancel-in-progress: false

jobs:
  keo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # keo_cost_campaign_tiktok.py nằm ở gốc repo auto_run_python-.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requests đi kèm google-cloud-bigquery nên không cần cài riêng.
      - name: Cài thư viện
        run: pip install --quiet google-cloud-bigquery

      - name: Kiểm tra secrets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TIKTOK_COOKIE: ${{ secrets.TIKTOK_COOKIE_RHYSMAN }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then echo "::error::Thiếu secret GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; fi
          if [ -z "$TIKTOK_COOKIE" ]; then echo "::error::Thiếu secret TIKTOK_COOKIE_RHYSMAN"; exit 1; fi

      - name: Kéo chi phí 3 tài khoản ads -> BigQuery
        env:
          PYTHONUTF8: "1"
          TIKTOK_COOKIE: ${{ secrets.TIKTOK_COOKIE_RHYSMAN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LAST_DAYS: ${{ github.event.inputs.last_days || '3' }}
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
        run: |
          set -euo pipefail
          if [ -n "${DATE_FROM:-}" ]; then
            if [ -n "${DATE_TO:-}" ]; then
              python -u keo_ads_tiktok_new.py --from "$DATE_FROM" --to "$DATE_TO"
            else
              python -u keo_ads_tiktok_new.py --from "$DATE_FROM"
            fi
          else
            python -u keo_ads_tiktok_new.py --last-days "$LAST_DAYS"
          fi
